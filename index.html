<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080a10"><title>Abderrahmen ch. Racing 3D</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#080a10;color:white;font-family:system-ui;touch-action:none}#game,canvas{position:fixed;inset:0;width:100%;height:100%}#load{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#27313e,#080a10 70%);padding:24px}.logo{font-size:30px;font-weight:900;color:#17120a;background:linear-gradient(135deg,#ffe8ac,#a8792a);border-radius:22px;padding:18px;width:72px;margin:auto auto 15px}h1{font-size:clamp(25px,7vw,38px);margin:0}p{color:#bdc4d0;font-size:13px;line-height:1.6}button{touch-action:none;font:inherit}#start{border:0;border-radius:14px;padding:14px 24px;font-weight:900;background:linear-gradient(135deg,#ffe8ac,#c59a45);color:#17120a}#hud{display:none;position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:7px}.glass{background:#090c13c9;border:1px solid #ffffff35;border-radius:13px;padding:8px 10px;backdrop-filter:blur(9px)}.brand{font-size:11px;font-weight:900}.brand small{display:block;color:#d6b56d;font-size:9px;letter-spacing:1.4px}.stats{display:flex;gap:5px}.stat{text-align:center;min-width:58px}.stat label{display:block;color:#b7c0cd;font-size:8px}.stat b{font-size:18px}.stat em{font-size:8px;color:#d6b56d;font-style:normal}#msg{position:absolute;top:80px;width:100%;text-align:center;color:#ffe8ac;font-size:12px}#controls{position:absolute;bottom:20px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end}.cluster{display:flex;gap:8px;pointer-events:auto}.ctrl{border:1px solid #ffffff55;border-radius:20px;background:#111925d9;color:white;width:60px;height:60px;font-size:21px;font-weight:900}.ctrl:active,.ctrl.p{background:#d6b56d;color:#15100a}.gas{height:78px;width:70px;background:#d6b56d;color:#15100a;font-size:13px}.brake{font-size:11px}#barbox{position:absolute;bottom:105px;left:14px;right:14px;height:4px;background:#ffffff40;border-radius:9px}#bar{height:100%;width:0;background:#f0d28a}#end{display:none;position:fixed;inset:0;z-index:10;place-items:center;background:#05070bdd;text-align:center;padding:25px}.card{border:1px solid #d6b56d80;border-radius:24px;padding:25px;background:#121720;max-width:360px}.card button{border:0;border-radius:11px;padding:12px 17px;background:#d6b56d;font-weight:900}
</style></head><body><div id="game"></div><div id="load"><div><div class="logo">A</div><h1>Abderrahmen ch.</h1><p>RACING 3D · FIRST-PERSON HIGHWAY<br>Touch controls · Traffic · 5 km challenge</p><p id="status">Preparing 3D engine…</p><button id="start">START ENGINE</button></div></div><div id="hud"><div class="top"><div class="glass brand">ABDER RAHMEN CH.<small>RACING DIVISION</small></div><div class="stats"><div class="glass stat"><label>SPEED</label><b id="speed">0</b><em>KM/H</em></div><div class="glass stat"><label>DISTANCE</label><b id="distance">0.0</b><em>KM</em></div><div class="glass"><button id="pause" style="pointer-events:auto;background:none;border:0;color:white">Ⅱ</button></div></div></div><div id="msg">Avoid traffic · Reach the finish</div><div id="barbox"><div id="bar"></div></div><div id="controls"><div class="cluster"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="cluster"><button class="ctrl brake" id="brake">BRAKE</button><button class="ctrl gas" id="gas">ACCEL</button></div></div></div><div id="end"><div class="card"><div class="logo">A</div><h2 id="endtitle">RACE COMPLETE</h2><p id="endtext"></p><button id="again">RACE AGAIN</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const $=x=>document.getElementById(x);let scene,cam,renderer,clock,started=false,paused=false,dist=0,speed=0,xpos=0,steer=0,health=100,road=[],cars=[],trees=[],keys={};const mats={road:null,gold:null,white:null,black:null,tree:null,glass:null};function mat(c,r=.8,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function box(w,h,d,m,x=0,y=0,z=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;return o}
function car(color,traffic=true){let g=new THREE.Group(),body=mat(color,.3,.4);g.add(box(1.8,.45,3.7,body,0,.65,0));g.add(box(1.45,.6,1.65,mats.glass,0,1.12,-.1));for(let xx of [-1,1])for(let zz of [-1.15,1.15]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.2,16),mats.black);w.rotation.z=Math.PI/2;w.position.set(xx*.95,.35,zz);g.add(w)}for(let xx of [-.58,.58]){g.add(box(.3,.12,.06,mats.gold,xx,.65,-1.88));if(traffic)g.add(box(.3,.12,.06,mat(0xc32f3a),xx,.65,1.88))}return g}
function init(){mats.road=mat(0x252a32);mats.gold=mat(0xe1bd70,.35,.4);mats.white=mat(0xe8e5dc);mats.black=mat(0x090b10,.35,.3);mats.tree=mat(0x20382e);mats.glass=new THREE.MeshStandardMaterial({color:0x263a4a,metalness:.5,roughness:.2});scene=new THREE.Scene();scene.background=new THREE.Color(0x101a26);scene.fog=new THREE.FogExp2(0x101a26,.0075);cam=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,600);cam.position.set(0,2,3);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xa7c8ef,0x403021,1.7));let sun=new THREE.DirectionalLight(0xffe0ad,2.5);sun.position.set(-15,30,10);sun.castShadow=true;scene.add(sun);let ground=new THREE.Mesh(new THREE.PlaneGeometry(500,700),mat(0x655846));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.2,-240);scene.add(ground);
for(let i=0;i<20;i++){let h=14+Math.random()*30,m=new THREE.Mesh(new THREE.ConeGeometry(15+Math.random()*25,h,5),mat(i%2?0x293743:0x202c37));m.position.set((Math.random()-.5)*230,h/2-1,-100-Math.random()*250);scene.add(m)}
for(let i=0;i<30;i++){let z=-i*18,s=new THREE.Group();s.position.z=z;s.add(box(14,.14,18,mats.road,0,-.08,0));s.add(box(.15,.03,18,mats.gold,-6.7,.01,0));s.add(box(.15,.03,18,mats.gold,6.7,.01,0));for(let xx of [-2.3,2.3])s.add(box(.12,.025,5,mats.white,xx,.02,0));scene.add(s);road.push(s);if(i%2===0)for(let side of [-1,1]){let pole=box(.12,4.7,.12,mat(0x454a52),side*9.3,2.3,z);scene.add(pole);scene.add(box(1.4,.12,.12,mat(0x454a52),side*8.7,4.5,z));let lamp=new THREE.PointLight(0xffc86b,1.5,12);lamp.position.set(side*8.2,4.2,z);scene.add(lamp);let tree=new THREE.Group();tree.add(box(.25,2,.25,mat(0x49382a),0,1,0));let crown=new THREE.Mesh(new THREE.ConeGeometry(1.4,3.8,7),mats.tree);crown.position.y=3;tree.add(crown);tree.position.set(side*(13+Math.random()*5),0,z);scene.add(tree);trees.push(tree)}}
let dash=new THREE.Group();cam.add(dash);scene.add(cam);dash.position.set(0,-.72,-1.5);dash.add(box(4.2,.45,1,mats.black,0,-.18,-.2));dash.add(box(1.5,.1,.25,mats.gold,0,.06,-.15));let wheel=new THREE.Mesh(new THREE.TorusGeometry(.4,.06,10,32),mats.black);wheel.position.set(0,-.03,.05);dash.add(wheel);dash.add(box(.08,.62,.08,mats.black,0,-.03,.04));
for(let i=0;i<9;i++){let c=car([0x3e8da8,0xd6d8dc,0x9f3439,0x465161,0xc5a15c][i%5]);c.position.set([-4.5,-1.5,1.5,4.5][i%4],0,-55-i*42);scene.add(c);cars.push(c)}clock=new THREE.Clock();onresize()}
function onresize(){if(renderer){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}}addEventListener('resize',onresize);
function hold(id,k){let e=$(id);let down=ev=>{ev.preventDefault();keys[k]=true;e.classList.add('p')},up=ev=>{ev.preventDefault();keys[k]=false;e.classList.remove('p')};e.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,up))}['left','right','gas','brake'].forEach(k=>hold(k,k));addEventListener('keydown',e=>{let k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake'}[e.key];if(k)keys[k]=true});addEventListener('keyup',e=>{let k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake'}[e.key];if(k)keys[k]=false});
function start(){if(!renderer){try{init()}catch(e){$('status').textContent='3D engine did not load. Check internet and reload.';return}}started=true;paused=false;dist=0;speed=0;xpos=0;health=100;cars.forEach((c,i)=>{c.position.set([-4.5,-1.5,1.5,4.5][i%4],0,-55-i*42);c.visible=true});$('load').style.display='none';$('end').style.display='none';$('hud').style.display='block';$('msg').textContent='Avoid traffic · Reach the finish'}$('start').onclick=start;$('again').onclick=start;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('msg').textContent=paused?'PAUSED':'Avoid traffic · Reach the finish'};
function finish(won){started=false;$('end').style.display='grid';$('endtitle').textContent=won?'RACE COMPLETE':'RACE OVER';$('endtext').textContent=won?'You completed the 5 km highway challenge!':'Collision! Try again and dodge the traffic.'}
function animate(){requestAnimationFrame(animate);if(!renderer)return;let dt=Math.min(clock.getDelta(),.04);if(started&&!paused){if(keys.gas)speed+=43*dt;else speed-=9*dt;if(keys.brake)speed-=65*dt;speed=THREE.MathUtils.clamp(speed,0,245);let si=(keys.left?-1:0)+(keys.right?1:0);steer=THREE.MathUtils.lerp(steer,si,.13);xpos=THREE.MathUtils.clamp(xpos+steer*dt*(1.4+speed*.025),-5.1,5.1);let move=speed/3.6*dt;dist+=move;road.forEach(s=>{s.position.z+=move;if(s.position.z>12)s.position.z-=540});trees.forEach(t=>{t.position.z+=move;if(t.position.z>12)t.position.z-=540});cars.forEach((c,i)=>{c.position.z+=move*(.55+(i%4)*.07);if(c.position.z>8){c.position.z=-230-Math.random()*190;c.position.x=[-4.5,-1.5,1.5,4.5][Math.floor(Math.random()*4)]}if(Math.abs(c.position.z)<2.4&&Math.abs(c.position.x-xpos)<1.65&&speed>25){speed*=.4;c.position.z=-90-Math.random()*70;$('msg').textContent='COLLISION! Watch the road';health-=25;if(health<=0)finish(false)}});cam.position.x=THREE.MathUtils.lerp(cam.position.x,xpos*.27,.08);cam.position.y=2+Math.sin(dist*.018)*.015;cam.rotation.z=-steer*.018;cam.rotation.y=-xpos*.012-steer*.025;$('speed').textContent=Math.round(speed);$('distance').textContent=(dist/1000).toFixed(1);$('bar').style.width=Math.min(100,dist/5000*100)+'%';if(dist>=5000)finish(true)}renderer.render(scene,cam)}$('status').textContent='Ready — tap START ENGINE';animate()})();
</script></body></html>
